[tools]
bun = "latest"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.typecheck]
description = "Type-check the plugin"
run = "bun run typecheck"

[tasks.upgrade]
description = "Upgrade all packages and the bun lockfile"
run = "bun update --latest"

[tasks.install]
description = "Symlink the plugin into ~/.config/amp/plugins/scoped-yolo.ts"
run = '''
mkdir -p ~/.config/amp/plugins
ln -sf "$PWD/src/index.ts" ~/.config/amp/plugins/scoped-yolo.ts
echo "linked $PWD/src/index.ts -> ~/.config/amp/plugins/scoped-yolo.ts"
'''
